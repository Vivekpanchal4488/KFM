<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MALLU</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .title {
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 24px;
      color: #ffffff;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }

    .video-wrapper {
      width: 100%;
      max-width: 500px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
      background: #000;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <h1 class="title">MALLU</h1>

  <div class="video-wrapper">
    <video id="memeVideo" autoplay loop muted playsinline preload="auto">
      <source src="video.mp4/WhatsApp Video 2026-09-11 at 6.02.44 PM.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
  </div>

  <script>
    const vid = document.getElementById('memeVideo');
    vid.muted = true;
    vid.play().catch(err => {
      console.warn('Autoplay was blocked:', err);
    });
  </script>

</body>

</html>
